<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            background-color: #ffdeeb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Falling Hearts Animation */
        .heart {
            position: fixed;
            top: -10px;
            color: #ff4d6d;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(105vh); } }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 5px solid #ff4d6d;
            width: 320px;
            position: relative;
            z-index: 10;
        }

        h1 { color: #ff4d6d; font-size: 22px; min-height: 80px; margin-top: 15px; }
        .buttons { margin-top: 20px; display: flex; justify-content: center; gap: 20px; height: 50px; }
        
        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #yesBtn { background-color: #ff4d6d; color: white; position: relative; z-index: 101; }
        #noBtn { 
            background-color: #ccc; 
            color: white; 
            position: absolute; 
            transition: all 0.2s ease;
        }

        .hidden { display: none !important; }
        img { width: 220px; height: 200px; object-fit: contain; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <audio id="noMusic" loop><source src="Do Ra-mi in Three.mp3" type="audio/mpeg"></audio>
        
        <audio id="yesMusic" loop><source src="love language.mp3" type="audio/mpeg"></audio>

        <div id="page1">
            <img id="mainImg" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v87TfLoU58jQGq7uM8/giphy.gif">
            <h1 id="mainText">Rachel, will you be my Valentine?</h1>
            <div class="buttons">
                <button id="yesBtn" onclick="nextPage()">YES</button>
                <button id="noBtn" onmouseover="handleNo()" onclick="handleNo()">NO</button>
            </div>
        </div>

        <div id="page2" class="hidden">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmtuM3ZndXp2N3R4eXo0eXo0eXo0eXo0eXo0eXo0eXo0eXo0ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26hpKz78Y6I6NlXyM/giphy.gif">
            <h1>OMG, you said yes! ❤️</h1>
            <p style="color: #ff4d6d; font-weight: bold;">I love you so much!</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesMusic = document.getElementById('yesMusic');
        const noMusic = document.getElementById('noMusic');
        const mainImg = document.getElementById('mainImg');
        const mainText = document.getElementById('mainText');
        const yesBtn = document.getElementById('yesBtn');

        let noCount = 0;
        const sadImages = [
            "https://media.giphy.com/media/OPU6wUKARA8AU/giphy.gif",
            "https://media.giphy.com/media/7SF5scGB2AFrO/giphy.gif",
            "https://media.giphy.com/media/BEob5zFkS7LWQ/giphy.gif",
            "https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"
        ];
        
        const sadTexts = [
            "Please be my Valentine??", 
            "I'll be so sad...", 
            "Think about it again!", 
            "You left me no choice! Click YES!"
        ];

        function handleNo() {
            // Start "Do Ra-mi" while she is playing hard to get
            if (noMusic.paused) {
                noMusic.play().catch(e => console.log("Music play blocked"));
            }

            // Guilt-trip: Change image/text and make YES button bigger
            if (noCount < sadImages.length) {
                mainImg.src = sadImages[noCount];
                mainText.innerText = sadTexts[noCount];
                
                let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
                yesBtn.style.fontSize = (currentSize * 1.2) + "px";
                yesBtn.style.padding = (currentSize * 0.8) + "px " + (currentSize * 1.5) + "px";
                
                noCount++;
            }

            // Move the NO button
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function nextPage() {
            noMusic.pause(); // Stop "Do Ra-mi"
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
            
            yesMusic.play(); // Play "love language" as the victory song
            
            // Start the falling hearts celebration
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
