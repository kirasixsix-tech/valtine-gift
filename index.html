<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        :root {
            --heart-red: #ff4b6e;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Scalloped Border Frame */
        .border-frame {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            border: 12px solid var(--heart-red);
            box-sizing: border-box;
            z-index: 100;
        }

        .container {
            width: 85%;
            max-width: 350px;
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
        }

        .hidden { display: none; }

        /* Animated CSS Heart */
        .heart-box {
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .heart {
            background-color: var(--heart-red);
            display: inline-block;
            height: 50px;
            position: relative;
            transform: rotate(-45deg);
            width: 50px;
            animation: pulse 1.2s infinite;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: var(--heart-red);
            border-radius: 50%;
            height: 50px;
            position: absolute;
            width: 50px;
        }

        .heart:before { top: -25px; left: 0; }
        .heart:after { left: 25px; top: 0; }

        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.3); }
            100% { transform: rotate(-45deg) scale(1); }
        }

        h1 { font-size: 1.3rem; color: #444; }

        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        #yesBtn { background: var(--heart-red); color: white; }
        #noBtn { background: #eee; color: #888; position: relative; }

        .icon-btn {
            font-size: 2rem;
            background: #fff5f6;
            border: 2px solid #ffdae0;
            width: 70px; height: 70px;
            border-radius: 20px;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="border-frame"></div>

    <div id="step1" class="container">
        <div class="heart-box"><div class="heart"></div></div>
        <h1>Paing, will you be my valentine?</h1>
        <div class="btn-group">
            <button class="btn" id="yesBtn" onclick="next('step2')">YES</button>
            <button class="btn" id="noBtn" onmouseover="move()">NO</button>
        </div>
    </div>

    <div id="step2" class="container hidden">
        <div class="heart-box"><div class="heart" style="transform: rotate(-45deg) scale(0.7);"></div></div>
        <h1>OMG, you said yes! ❤️</h1>
        <div class="btn-group">
            <button class="icon-btn" onclick="next('forever')">🏠</button>
            <button class="icon-btn" onclick="next('words')">✉️</button>
            <button class="icon-btn" onclick="next('flowers')">🎁</button>
        </div>
        <a href="#" class="back-link" onclick="next('step1')">Back to start</a>
    </div>

    <div id="forever" class="container hidden">
        <h2>FOREVER TOGETHER</h2>
        <p>Placeholder for your beautiful memories!</p>
        <button class="btn" id="yesBtn" onclick="next('step2')">Back</button>
    </div>

    <div id="words" class="container hidden">
        <h2>FROM MY HEART</h2>
        <p>My love, you make every day brighter...</p>
        <button class="btn" id="yesBtn" onclick="next('step2')">Back</button>
    </div>

    <div id="flowers" class="container hidden">
        <h2>FOR YOU</h2>
        <p>🌼 Daisy | 🌹 Rose | 💐 Bunches</p>
        <button class="btn" id="yesBtn" onclick="next('step2')">Back</button>
    </div>

    <audio id="yesMusic" src="love language.mp3" loop></audio>
    <audio id="noMusic" src="Do Ra-mi in Three.mp3"></audio>

    <script>
        function next(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'step2') {
                document.getElementById('noMusic').pause();
                document.getElementById('yesMusic').play().catch(()=>{});
            }
        }

        function move() {
            const b = document.getElementById('noBtn');
            document.getElementById('noMusic').play().catch(()=>{});
            b.style.position = 'fixed';
            b.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            b.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        }
    </script>
</body>
</html>
