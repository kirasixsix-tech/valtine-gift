<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Be My Valentine?</title> <style> body { background-color: #ffdeeb; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Comic Sans MS', cursive; overflow: hidden; margin: 0; } .container { text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 5px solid #ff4d6d; max-width: 400px; position: relative; } h1 { color: #ff4d6d; } .buttons { margin-top: 20px; display: flex; justify-content: center; gap: 20px; height: 50px; } button { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; font-weight: bold; } #yesBtn { background-color: #ff4d6d; color: white; } #noBtn { background-color: #ccc; color: white; position: absolute; transition: 0.1s; } .hidden { display: none !important; } img { width: 100%; border-radius: 10px; margin-bottom: 10px; } </style> </head> <body> <div class="container"> <audio id="bgMusic" loop> <source src="Do Ra-mi in Three.mp3" type="audio/mpeg"> </audio> <div id="page1"> <img src=""> <h1>Rachel, will you be my Valentine?</h1> <div class="buttons"> <button id="yesBtn" onclick="nextPage()">YES</button> <button id="noBtn" onmouseover="moveButton()">NO</button> </div> </div> <div id="page2" class="hidden"> <img src=""> <h1>OMG, you said yes! ❤️</h1> <p>I'm so grateful for you every day.</p> </div> </div> <script> const noBtn = document.getElementById('noBtn'); const music = document.getElementById('bgMusic'); function moveButton() { const x = Math.random() * (window.innerWidth - noBtn.offsetWidth); const y = Math.random() * (window.innerHeight - noBtn.offsetHeight); noBtn.style.left = x + 'px'; noBtn.style.top = y + 'px'; } function nextPage() { document.getElementById('page1').classList.add('hidden'); document.getElementById('page2').classList.remove('hidden'); music.play().catch(e => console.log("Audio play deferred")); } </script> </body> </html>
